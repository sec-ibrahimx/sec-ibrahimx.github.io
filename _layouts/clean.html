<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0b0f19] text-slate-200 min-h-screen">
  <header class="w-full border-b border-slate-800/60 bg-[#0b0f19]/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="/" class="text-sm font-bold text-slate-100 no-underline hover:text-white">Ibrahim Security</a>
      <nav class="flex items-center gap-4 text-xs font-medium text-slate-400">
        <a href="/" class="hover:text-slate-200 transition">About</a>
        <a href="/research/" class="hover:text-slate-200 transition">Research & Papers</a>
        <a href="/projects/" class="hover:text-slate-200 transition">Projects</a>
        <a href="/blog/" class="hover:text-slate-200 transition">Blog</a>
        <a href="/cv/" class="hover:text-slate-200 transition">CV</a>
      </nav>
    </div>
  </header>

  <main class="w-full max-w-2xl mx-auto px-4 sm:px-6 py-8">
    {{ content }}
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
