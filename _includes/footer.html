{% include base_path %}

<style>
  /* إرجاع تسلسل الصفحة لوضعه الطبيعي وإلغاء أي حشو عائم */
  body,
  #main,
  .page__content {
    padding-bottom: 0 !important;
    margin-bottom: 0 !important;
  }

  /* جعل الفوتر عنصراً عادياً في نهاية الصفحة بعد كامل المحتوى */
  .page__footer,
  footer.page__footer,
  div.page__footer {
    position: static !important;
    clear: both !important;
    float: none !important;
    display: block !important;
    width: 100% !important;
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    border-top: none !important;
    box-shadow: none !important;
    margin: 60px auto 30px auto !important;
    padding: 0 !important;
    text-align: center !important;
  }

  .page__footer::before,
  .page__footer::after,
  footer::before,
  footer::after {
    display: none !important;
  }

  /* الإطار الكبسولي الصغير على مقاس النص فقط */
  .custom-clean-footer {
    display: inline-block !important;
    padding: 8px 22px !important;
    border: 1px solid #30363d !important;
    border-radius: 8px !important;
    background-color: #161b22 !important;
    color: #8b949e !important;
    font-size: 0.82rem !important;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2) !important;
  }
</style>

<div class="custom-clean-footer">
  &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}. All rights reserved.
</div>
