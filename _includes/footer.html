{% include base_path %}

<style>
  /* إزالة أي حدود وخلفيات من حاوية الفوتر الخارجية */
  .page__footer,
  footer.page__footer,
  div.page__footer {
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    border-top: none !important;
    box-shadow: none !important;
    margin-top: 2rem !important;
    padding: 0 !important;
    width: 100% !important;
    max-width: 100% !important;
  }

  /* إزالة أي خلفيات أو عروض محصورة من الحاوية الداخلية للفوتر */
  .page__footer footer,
  .page__footer-follow,
  .page__footer-copyright,
  .page__footer .container {
    background: transparent !important;
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
    max-width: 100% !important;
    margin: 0 auto !important;
    padding: 1.5rem 0 2rem 0 !important;
  }

  /* قتل أي عناصر زائفة تصنع الخطوط البيضاء */
  .page__footer::before,
  .page__footer::after,
  footer::before,
  footer::after {
    display: none !important;
    content: none !important;
    border: none !important;
  }

  /* إزالة أي حد سفلي من حاوية المحتوى الرئيسي السابقة للفوتر مباشرة */
  #main,
  .initial-content,
  #main::after {
    border-bottom: none !important;
    box-shadow: none !important;
  }

  /* تنسيق نص الحقوق ليكون هادئاً وفي المنتصف */
  .custom-clean-footer {
    text-align: center !important;
    color: #8b949e !important;
    font-size: 0.85rem !important;
    letter-spacing: 0.5px;
    padding: 20px 0;
  }
</style>

<div class="custom-clean-footer">
  &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}. All rights reserved.
</div>
